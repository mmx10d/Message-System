<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/basic.css">
  <link rel="stylesheet" href="../css/login.css">
  <script src="../script/security.js"></script>
  <title>login</title>
</head>

<body>
  <form>
    <fieldset>
      <legend>login</legend>
      <label for="email">Email Adress:</label>
      <input type="email" id="email">
      <label for="password">Password:</label>
      <input type="password" id="password">
      <!-- add checkbox for stay login -->
      <input onclick="send()" type="button" value="login">
      <a href="/api/signup">no account? login</a>
    </fieldset>
  </form>
  <dialog>
    <span></span>
    <button onclick="pop.close()">ok</button>
  </dialog>
  <!--varibles-->
  <script>
    //to change it later
    const website = location.href;
    const legend = document.querySelector("legend");
    const name_input = document.querySelector("#name");
    const email_input = document.querySelector("#email");
    const password_input = document.querySelector("#password");
    const pop = document.querySelector("dialog");
  </script>
  <!--functions-->
  <script>
    function modal(message = "add message") {
      pop.querySelector("span").innerText = message;
      pop.showModal();
    }
    function send() {
      const $email = email_input.value;
      const $password = password_input.value;
      fetch(website, {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: JSON.stringify(
          {
            "email": $email,
            "password": $password
          }
        )
      })
        .then(res => res.text())
        .then(res => {
          //save user data and then back to home
          if (res[2] === "i") { //i for id if that response has it mean is ok i dont know why res.ok not work i'll search later
            localStorage.setItem("user", res);
            location.pathname = "/";
          }
          else {
            modal(res);
          }
        })
        .catch(error => {
          console.log({ message: "no connection", error: error });
        });
    }
  </script>
</body>

</html>
