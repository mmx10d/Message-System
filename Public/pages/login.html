<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/login.css">
  <title>login</title>
</head>

<body>
  <form>
    <fieldset>
      <legend>login</legend>
      <label for="email">Email Adress:</label>
      <input type="email" id="email">
      <label for="password">Password:</label>
      <input type="password" id="password">
      <!-- add checkbox for stay login -->
      <input onclick="send()" type="button" value="login">
      <a href="/api/signup">no account? login</a>
    </fieldset>
  </form>
  <dialog><button onclick="modal.close()">ok</button></dialog>
  <!--varibles-->
  <script>
    //to change it later
    const website = "http://localhost:3000";
    const legend = document.querySelector("legend");
    const name_input = document.querySelector("#name");
    const email_input = document.querySelector("#email");
    const password_input = document.querySelector("#password");
    const modal = document.querySelector("dialog");
  </script>
  <!--functions-->
  <script>
    function send() {
      const $email = email_input.value;
      const $password = password_input.value;
      fetch(`${website}/api/login`, {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: JSON.stringify(
          {
            "email": $email,
            "password": $password
          }
        )
      })
        .then(res => res.json())
        .then(res => {
          //save user data and then back to home
          localStorage.setItem("user", JSON.stringify(res));
          location.pathname = "/";
        })
        .catch(error => {
          console.log({ message: "no connection", error: error });
        });
    }
  </script>
</body>

</html>
