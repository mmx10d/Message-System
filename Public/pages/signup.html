<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/basic.css">
  <link rel="stylesheet" href="../css/login.css">
  <script src="../script/security.js"></script>
  <title>signup</title>
</head>

<body>
  <form>
    <fieldset>
      <legend>signup</legend>
      <label for="name">Name:</label>
      <input type="text" id="name">
      <label for="email">Email Adress:</label>
      <input type="email" id="email">
      <label for="password">create Password:</label>
      <input type="password" id="password">
      <input onclick="send()" type="button" value="signup">
      <a href="/api/login">Already have account</a>
    </fieldset>
  </form>
  <dialog>
    <div>
      <span></span>
      <button onclick="pop.close()">ok</button>
    </div>
  </dialog>
  <!--varibles-->
  <script>
    //to change it later
    const website = location.href;
    const legend = document.querySelector("legend");
    const name_input = document.querySelector("#name");
    const email_input = document.querySelector("#email");
    const password_input = document.querySelector("#password");
    const pop = document.querySelector("dialog");
  </script>
  <!--functions-->
  <script>
    function modal(message = "add message") {
      pop.querySelector("span").innerText = message;
      pop.showModal();
    }
    function send() {
      const $name = name_input.value;
      const $email = email_input.value;
      const $password = password_input.value;
      console.log(`${website}`)
      fetch(website, {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: JSON.stringify(
          {
            "name": $name,
            "email": $email,
            "password": $password
          }
        )
      })
        .then(res => res.text())
        .then(res => {
          //back to login
          if (res === "success signup") {
            location.pathname = "/api/login";
          }
          else {
            modal(res);
          }
        })
        .catch(error => {
          console.log(error.message);
        });
    }
  </script>
</body>

</html>
