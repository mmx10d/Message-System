<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/index.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="../script/security.js"></script>
  <title>Messages</title>
</head>

<body>
  <!-- all messages -->
  <main>
    <!-- reciver inforomation -->
    <header style="display: none;">
      <!-- send photo -->
      <div>
        <img src="./icons/default.png">
      </div>
      <!-- sender name -->
      <span></span>
      <!-- more option -->
      <button>
        <img src="icons/block.png">
      </button>
    </header>
    <main>
      <h1>Welcome </h1>
    </main>
    <!-- input for send -->
    <footer style="display: none;">
      <input type="text" placeholder="message">
      <button onclick="send_message()">
        <img src="./icons/send.png">
      </button>
    </footer>
  </main>
  <!-- all chats here -->
  <aside>
    <!-- text mean chats -->
    <header>
      <h1>Chats</h1>
      <button onclick="find_pop.showModal()">
        <img src="icons/add.png">
      </button>
    </header>
    <!-- all users here -->
    <main></main>
    <footer class="profile">
      <button onclick="localStorage.removeItem('user');location.reload()">logout</button>
      <h3 id="user_name"></h3>
      <img alt="user profile" onerror="this.src='icons/default.png'" onclick="show_my_info()">
    </footer>
  </aside>






  <!-- <h1>test server before socket.io</h1> -->
  <!-- <h1 id="name"></h1> -->
  <!-- add remove account with data or without then signup in setting can restore the data then link from random id-->
  <dialog>
    <span></span>
    <button onclick="pop.close()">ok</button>
  </dialog>

  <!-- uploade photo dialog -->
  <dialog class="uploade">
    <label for="file">Choose File</label>
    <input type="file" id="file">
  </dialog>


  <!-- //search pop -->
  <dialog class="find_pop">
    <div>
      <!-- //search button -->
      <header>
        <input type="text" placeholder="Id or Name" onkeyup="find_user(this.value)">
      </header>
      <!-- result -->
      <main>search result</main>
      <button onclick="find_pop.close()">done</button>
    </div>
  </dialog>

  <dialog class="info_pop">
    <!-- show info -->
    <div><!-- edit info or account manag -->
      <aside>
        <span id="info_pop_public" onclick="change_info_to_public()">public</span>
        <span id="info_pop_account" onclick="change_info_to_account()">account setting</span>
      </aside>
      <main>
        <!-- show photo -->
        <header>
          <h1>My Information</h1>
        </header>
        <main>
          <!-- show when click hide and can edit and show ok button or edit page -->
          <img src="#" alt="profile photo" onerror="this.src='icons/default.png'">
          <span>id: </span>
          <span>name: </span>
        </main>
      </main>
    </div>
    <button onclick="info_pop.close()">close</button>
  </dialog>

  <script src="script/index.js"></script>
</body>

</html>
