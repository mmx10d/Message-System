<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/index.css">
  <script src="/socket.io/socket.io.js"></script>
  <title>Messages</title>
</head>

<body>
  <!-- all messages -->
  <main>
    <!-- reciver inforomation -->
    <header>
      <!-- send photo -->
      <div>
        <img
          src="https://img.magnific.com/free-photo/image-icon-front-side_187299-39480.jpg?semt=ais_hybrid&w=740&q=80">
      </div>
      <!-- sender name -->
      <span>name</span>
      <!-- more option -->
      <button>...</button>
    </header>
    <main>
      <div class="self">
        <!-- here message content from self -->
        <span>Want to send someone?</span>
        <!-- time -->
        <span>00:00</span>
      </div>
      <div class="sender">
        <!-- here message content from self -->
        <span>yeah</span>
        <!-- time -->
        <span>00:01</span>
      </div>
      <div class="self">
        <!-- here message content from self -->
        <span>choose who 😎!</span>
        <!-- time -->
        <span>00:00</span>
      </div>
    </main>
    <!-- input for send -->
    <footer style="display: none;">
      <input type="text" placeholder="message">
      <button onclick="send_message()">
        <img
          src="https://img.magnific.com/free-photo/image-icon-front-side_187299-39480.jpg?semt=ais_hybrid&w=740&q=80">
      </button>
    </footer>
  </main>
  <!-- all chats here -->
  <aside>
    <!-- account status and logout button -->
    <div class="profile">
      <button onclick="localStorage.removeItem('user');location.reload()">logout</button>
      <span id="user_name"></span>
      <div>
        <img src="#" alt="profile">
      </div>
    </div>
  </aside>







  <!-- <h1>test server before socket.io</h1> -->
  <!-- <h1 id="name"></h1> -->
  <!-- add remove account with data or without then signup in setting can restore the data then link from random id-->
  <dialog>
    <button onclick="modal.close()">ok</button>
  </dialog>
  <script src="script/index.js"></script>
</body>

</html>
